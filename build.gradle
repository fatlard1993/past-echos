plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.17'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.mod_id
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// The preprocessor's echo file reader, nested in the jar.
	implementation project(':preprocessor')
	include project(':preprocessor')

	testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// The game writes its log beside whatever directory it starts in; keep that out of the repo.
	workingDir = layout.buildDirectory.dir("test-run").get().asFile
	doFirst { workingDir.mkdirs() }
	// The built test worlds and their diffs, shared with the preprocessor's tests.
	systemProperty "pastechos.fixtures", file("preprocessor/src/test/resources").absolutePath
}

// Fabric tests these predicates against the loader's *normalized* game version,
// not Mojang's id: 26.3-snapshot-10 is compared as 26.3-alpha.10. So a floor of
// ">=26.3" is false on every 26.3 snapshot, and writing the obvious thing makes
// the mod refuse to load on the version it was built for. Derived from the pin
// rather than written into the manifest, so the two cannot drift apart.
def mcFloor = project.minecraft_version
	.replaceFirst(/-snapshot-/, '-alpha.')
	.replaceFirst(/-pre-/, '-pre.')
	.replaceFirst(/-rc-/, '-rc.')
// The trailing dash is load-bearing: "<26.4" would still admit 26.4's snapshots,
// because a prerelease sorts below its own release.
def mcParts = mcFloor.tokenize('.-')
def minecraftDependency = ">=${mcFloor} <${mcParts[0]}.${(mcParts[1] as int) + 1}-"
// The +26.3 build tag is ignored in comparison; the floor is the number.
def fabricApiFloor = ">=" + project.fabric_version.replaceFirst(/\+.*$/, '')

processResources {
	inputs.property "version", project.version
	inputs.property "minecraftDependency", minecraftDependency
	inputs.property "loaderVersion", project.loader_version
	inputs.property "fabricApiVersion", fabricApiFloor

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
		       "minecraftDependency": minecraftDependency,
		       "loaderVersion": project.loader_version,
		       "fabricApiVersion": fabricApiFloor
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
