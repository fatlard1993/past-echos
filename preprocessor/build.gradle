plugins {
	id 'application'
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

application {
	mainClass = 'justfatlard.past_echos.preprocess.Main'
	applicationName = 'past-echos'
}

test {
	useJUnitPlatform {
		excludeTags 'regen'
	}
}

// Stage one end to end: downloads Mojang's server jars and runs them, several minutes.
tasks.register('regenTest', Test) {
	description = 'Regenerates the built test worlds with the real server jars and diffs them.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'regen'
	}
	// Each test regenerates a world; a tmpfs /tmp runs out.
	def scratch = layout.buildDirectory.dir('regen-tmp').get().asFile
	doFirst {
		scratch.mkdirs()
	}
	systemProperty 'java.io.tmpdir', scratch
	testLogging {
		events 'passed', 'failed'
	}
}
